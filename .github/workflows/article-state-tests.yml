name: Article state regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  article-state:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test production article state transitions
        run: bash scripts/test-article-state.sh
      - name: Confirm the regression fails on the original implementation
        env:
          YOMY_BASELINE_REF: 7efae88fa0f945fb586a1363624c180c1fc0a687
        run: |
          set +e
          bash scripts/test-article-state.sh -only-testing:YomiStateTests/ArticleStateTests/testMarkAllReadSupersedesPendingUnread > "$RUNNER_TEMP/state-baseline.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/state-baseline.log"
          test "$status" -ne 0
          grep -q 'XCTAssertTrue failed.*An older delayed unread action must not undo Mark All Read' "$RUNNER_TEMP/state-baseline.log"
      - name: Build app and widget without signing
        run: >-
          xcodebuild -project Yomi.xcodeproj -scheme Yomi
          -destination 'generic/platform=iOS Simulator'
          -configuration Debug build CODE_SIGNING_ALLOWED=NO
